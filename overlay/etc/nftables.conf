#!/usr/sbin/nft -f
# jarvis: send all non-ICMP traffic on wlan0 through the WMM best-effort queue.
# Verified 2026-11-02: the MT7663 hangs its VO (voice) TX queue on its own
# (watchdog log: failed_ac=[VO] tcp_ok=yes). OpenSSH 10.5 marks interactive traffic so it
# lands in VO, which killed SSH while pings passed. Clearing DSCP only downgrades priority.
# ICMP keeps its marking on purpose so jarvis-wifi-watchdog can still probe each queue.
flush ruleset

table inet jarvis_qos {
	chain postrouting {
		type filter hook postrouting priority mangle; policy accept;
		meta nfproto ipv4 oifname "wlan0" meta l4proto != icmp counter ip dscp set cs0
		meta nfproto ipv6 oifname "wlan0" meta l4proto != ipv6-icmp counter ip6 dscp set cs0
	}
}
