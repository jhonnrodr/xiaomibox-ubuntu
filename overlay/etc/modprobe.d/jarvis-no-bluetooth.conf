# MT7663 is a WiFi+BT combo on one USB device. btusb and mt7663u probing together race for the
# chip's patch semaphore ("mt7663u: Failed to get patch semaphore") and WiFi never comes up.
# Bluetooth is not needed for now, so keep btusb from loading.
blacklist btusb
blacklist btmtk
install btusb /bin/false
# mt7663u must load only after jarvis-wifi-power has power-cycled the chip; it loads it by name.
blacklist mt7663u
